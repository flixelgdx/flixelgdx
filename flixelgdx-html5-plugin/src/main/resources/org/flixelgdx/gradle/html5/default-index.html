<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}}</title>
{{FAVICON}}
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #{{CANVAS_ID}} {
      display: block;
      transform-origin: center center;
    }
  </style>
</head>
<body>
  <canvas id="{{CANVAS_ID}}"></canvas>
  <script>
    // Default runtime mode baked in by the build. The ?flixel.mode= URL parameter overrides it.
    window.flixelMode = window.flixelMode || {{MODE_DEFAULT}};

    (function () {
      var wasmEnabled = {{WASM_ENABLED}};

      function loadJs() {
        var script = document.createElement('script');
        script.src = "{{JS_BUNDLE}}";
        script.onload = function () {
          if (typeof main === 'function') {
            main();
          }
        };
        document.head.appendChild(script);
      }

      function loadWasm() {
        var runtime = document.createElement('script');
        runtime.src = "{{WASM_RUNTIME}}";
        runtime.onload = function () {
          if (window.TeaVM && TeaVM.wasmGC) {
            TeaVM.wasmGC.load("{{WASM_BUNDLE}}")
              .then(function (teavm) { teavm.exports.main([]); })
              .catch(loadJs);
          } else {
            loadJs();
          }
        };
        // If the WebAssembly bundle cannot be loaded, fall back to the JavaScript build so the game
        // still runs on browsers that lack WebAssembly GC support.
        runtime.onerror = loadJs;
        document.head.appendChild(runtime);
      }

      if (wasmEnabled && typeof WebAssembly !== 'undefined') {
        loadWasm();
      } else {
        loadJs();
      }
    })();
  </script>
  <script>
    (function () {
      var canvas = document.getElementById('{{CANVAS_ID}}');

      function scaleCanvas() {
        if (!canvas.width || !canvas.height) return;
        var scaleX = window.innerWidth / canvas.width;
        var scaleY = window.innerHeight / canvas.height;
        canvas.style.transform = 'scale(' + Math.min(scaleX, scaleY) + ')';
      }

      // Poll until the framework sets the canvas dimensions, then scale and watch for resizes.
      var poll = setInterval(function () {
        if (canvas.width && canvas.height) {
          clearInterval(poll);
          scaleCanvas();
          window.addEventListener('resize', scaleCanvas);
        }
      }, 100);
    })();
  </script>
</body>
</html>
