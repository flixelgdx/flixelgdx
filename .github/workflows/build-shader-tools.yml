# Temporary workflow that builds the glslang and spirv-cross command-line tools the shader plugin
# bundles. Download the artifacts, commit them into the plugin's tools/<classifier>/ folders, then
# delete this workflow.
name: Build shader tools

on:
  workflow_dispatch:
  push:
    branches: [feat/spirv-shader-pipeline]
    paths: [.github/workflows/build-shader-tools.yml]

env:
  GLSLANG_TAG: 16.6.0
  SPIRV_CROSS_TAG: vulkan-sdk-1.4.363.0

jobs:
  build:
    name: Build (${{ matrix.classifier }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-x86_64
            os: ubuntu-22.04
          - classifier: linux-aarch64
            os: ubuntu-22.04-arm
          - classifier: macos-aarch64
            os: macos-14
          - classifier: windows-x86_64
            os: windows-2022
          - classifier: windows-aarch64
            os: windows-11-arm
    steps:
      - name: Fetch sources
        shell: bash
        run: |
          git clone --depth 1 -b "$GLSLANG_TAG" https://github.com/KhronosGroup/glslang.git
          git clone --depth 1 -b "$SPIRV_CROSS_TAG" https://github.com/KhronosGroup/SPIRV-Cross.git

      - name: Build
        shell: bash
        run: |
          # Static C and C++ runtimes, so the binaries run on a clean machine with no extra installs.
          common=(-DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
          if [ "$RUNNER_OS" = "Linux" ]; then
            common+=("-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc")
          fi
          cmake -S glslang -B gb "${common[@]}" -DENABLE_OPT=OFF -DENABLE_HLSL=OFF \
            -DGLSLANG_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build gb --config Release --target glslang-standalone --parallel
          cmake -S SPIRV-Cross -B sb "${common[@]}" -DSPIRV_CROSS_ENABLE_TESTS=OFF \
            -DSPIRV_CROSS_SHARED=OFF -DSPIRV_CROSS_ENABLE_C_API=OFF -DSPIRV_CROSS_CLI=ON
          cmake --build sb --config Release --target spirv-cross --parallel

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp gb/StandAlone/Release/glslang.exe out/
            cp sb/Release/spirv-cross.exe out/
          else
            cp gb/StandAlone/glslang out/
            cp sb/spirv-cross out/
            strip out/* || true
          fi
          ls -la out
          ./out/glslang* --version | head -3

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.classifier }}
          path: out/
