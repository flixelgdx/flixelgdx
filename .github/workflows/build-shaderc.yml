name: Build shaderc binaries (temporary)

# Temporary, manually triggered workflow that builds bgfx's shaderc compiler for the platforms the
# Linux dev machine cannot produce. Run it from the Actions tab, download the artifacts, and commit
# each binary into the shader plugin's tools directory:
#
#   flixelgdx-shader-plugin/src/main/resources/org/flixelgdx/gradle/shader/tools/<classifier>/shaderc[.exe]
#
# The Linux binary is already vendored, so this only covers Windows and macOS. Remove this workflow
# once those binaries are committed and a permanent tooling pipeline exists.
on:
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # macOS arm64 (Apple Silicon). macos-14 is the only available macOS runner
  # now that macos-13 (Intel) has been retired by GitHub. Intel and Windows
  # binaries are already committed; this only produces the arm64 slice.
  # ---------------------------------------------------------------------------
  macos-aarch64:
    name: Build shaderc (macos-aarch64)
    runs-on: macos-14
    steps:
      - name: Checkout bx
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          ref: 01cf049f97e122901aef231dcb9d54a1a3b86e5b
          path: bx

      - name: Checkout bimg
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          ref: bf10ffbb3df1f9f12ad7a9105e5e96e11a9c5a0c
          path: bimg

      - name: Checkout bgfx
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bgfx
          ref: fbff26d5e5943ce20e4e67b2247100bbfb216ad1
          path: bgfx

      - name: Generate gmake project files
        working-directory: bgfx
        run: |
          chmod +x ../bx/tools/bin/darwin/genie
          ../bx/tools/bin/darwin/genie --with-tools --gcc=osx-arm64 gmake

      - name: Build shaderc
        working-directory: bgfx
        run: make -C .build/projects/gmake-osx-arm64 shaderc config=release64

      - name: Stage binary
        run: |
          mkdir -p out
          cp bgfx/.build/osx-arm64/bin/shadercRelease out/shaderc
          chmod +x out/shaderc

      - name: Upload shaderc (macos-aarch64)
        uses: actions/upload-artifact@v4
        with:
          name: shaderc-macos-aarch64
          path: out/shaderc
