name: Build miniaudio natives

# Temporary workflow: rebuilds the bundled miniaudio JNI library for all desktop platforms after
# C wrapper changes. Trigger it manually, download the artifacts, then commit the binaries to the
# audio branch and delete this workflow.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
            output: libflixel_miniaudio.so
            artifact: linux-x64

          - os: windows-latest
            label: Windows x64
            output: flixel_miniaudio.dll
            artifact: windows-x64

          - os: macos-latest
            label: macOS (universal)
            output: libflixel_miniaudio.dylib
            artifact: macos-universal

    steps:
      - name: Set up Java 17 (for JNI headers)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download miniaudio.h
        shell: bash
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/mackron/miniaudio/master/miniaudio.h \
            -o flixelgdx-desktop/src/main/native/miniaudio.h

      - name: Download stb_vorbis.c
        shell: bash
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/nothings/stb/master/stb_vorbis.c \
            -o flixelgdx-desktop/src/main/native/stb_vorbis.c

      # Linux / macOS ---------------------------------------------------------

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -O2 -shared -fPIC \
            -I"$JAVA_HOME/include" \
            -I"$JAVA_HOME/include/linux" \
            -o flixelgdx-desktop/src/main/native/${{ matrix.output }} \
            flixelgdx-desktop/src/main/native/flixel_miniaudio.c \
            -lm -lpthread -ldl

      - name: Build (macOS universal binary)
        if: runner.os == 'macOS'
        run: |
          clang -O2 -dynamiclib \
            -arch x86_64 -arch arm64 \
            -I"$JAVA_HOME/include" \
            -I"$JAVA_HOME/include/darwin" \
            -framework CoreAudio \
            -framework CoreFoundation \
            -framework AudioUnit \
            -o flixelgdx-desktop/src/main/native/${{ matrix.output }} \
            flixelgdx-desktop/src/main/native/flixel_miniaudio.c \
            -lm

      # Windows ---------------------------------------------------------------

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl.exe /O2 /LD /nologo ^
            /I"%JAVA_HOME%\include" ^
            /I"%JAVA_HOME%\include\win32" ^
            /Feflixelgdx-desktop\src\main\native\${{ matrix.output }} ^
            flixelgdx-desktop\src\main\native\flixel_miniaudio.c ^
            /link kernel32.lib ole32.lib user32.lib uuid.lib winmm.lib

      # Upload ----------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: flixelgdx-desktop/src/main/native/${{ matrix.output }}
          if-no-files-found: error
